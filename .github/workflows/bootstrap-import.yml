name: Bootstrap public medical-redact snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-import.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reconstruct source overlay
        shell: bash
        run: |
          set -euo pipefail
          overlay_b64="$RUNNER_TEMP/medical-redact-overlay.b64"
          overlay_patch="$RUNNER_TEMP/medical-redact-overlay.patch"
          cp .github/workflows/bootstrap-import.yml "$RUNNER_TEMP/bootstrap-import.yml"
          : > "$overlay_b64"

          for n in $(seq 1 60); do
            id=$(printf '%03d' "$n")
            cat ".bootstrap/overlay-${id}.b64" >> "$overlay_b64"
          done

          for n in $(seq 61 86); do
            id=$(printf '%03d' "$n")
            xxd -r -p ".bootstrap/overlay-${id}.hex" >> "$overlay_b64"
          done

          for n in $(seq 87 91); do
            id=$(printf '%03d' "$n")
            for p in 1 2 3; do
              part=$(printf '%02d' "$p")
              xxd -r -p ".bootstrap/overlay-${id}-${part}.hex" >> "$overlay_b64"
            done
          done

          base64 --decode "$overlay_b64" | gzip -d > "$overlay_patch"
          actual_sha=$(sha256sum "$overlay_patch" | awk '{print $1}')
          test "$actual_sha" = "353dbf3c68c656452a9910b245029bb7f71a433b05297209602b78494f4dea9a"

      - name: Rebuild clean public source root commit
        shell: bash
        run: |
          set -euo pipefail
          overlay_patch="$RUNNER_TEMP/medical-redact-overlay.patch"

          git remote add upstream https://github.com/Stirling-Tools/Stirling-PDF.git
          git fetch --no-tags --filter=blob:none upstream 87d790a30d8c072c7d84041afce3bc84528f1118
          git checkout --detach 87d790a30d8c072c7d84041afce3bc84528f1118

          git apply --binary --index "$overlay_patch"

          full_tree=$(git write-tree)
          echo "Rebuilt full source tree: $full_tree"
          test "$full_tree" = "4ee8cb01421e1d323722a3eb699dbf81a9e444a4"

          git rm -f .github/workflows/medical-redact-windows.yml
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/bootstrap-import.yml" .github/workflows/bootstrap-import.yml
          git add .github/workflows/bootstrap-import.yml

          root_tree=$(git write-tree)
          echo "Bootstrap root tree: $root_tree"

          export GIT_AUTHOR_NAME="medical-redact bootstrap"
          export GIT_AUTHOR_EMAIL="actions@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          commit=$(printf '%s\n' "Initial public medical-redact source snapshot" | git commit-tree "$root_tree")
          echo "PUBLIC_COMMIT=$commit" >> "$GITHUB_ENV"
          git push --force origin "$commit:refs/heads/main"
