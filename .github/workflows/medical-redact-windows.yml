name: Windows Full Offline Medical Redact

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64 full offline installers
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      JPDFIUM_PLATFORMS: windows-x64
      DISABLE_ADDITIONAL_FEATURES: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          architecture: x64

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: frontend/src-tauri
          shared-key: medical-redact-windows-x64
          cache-on-failure: true

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            engine/pyproject.toml
            engine/uv.lock

      - name: Install Python 3.13
        shell: pwsh
        run: uv python install 3.13

      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.54.0

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: medical-redact-gradle-${{ runner.os }}-${{ runner.arch }}-jdk25-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'buildSrc/**', 'settings.gradle', 'build.gradle', 'app/**/build.gradle', 'gradle/**/*.gradle') }}
          restore-keys: |
            medical-redact-gradle-${{ runner.os }}-${{ runner.arch }}-jdk25-

      - name: Show toolchain versions
        shell: pwsh
        run: |
          node --version
          npm --version
          java -version
          rustc --version
          cargo --version
          uv --version
          task --version
          Get-PSDrive -PSProvider FileSystem

      - name: Build and verify full offline Windows package
        shell: pwsh
        run: task medical-redact:package:windows:full-validation

      - name: Collect checksums
        shell: pwsh
        run: |
          $artifacts = @(
            Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File -ErrorAction SilentlyContinue
            Get-ChildItem "frontend/src-tauri/target/release/bundle/msi" -Filter "*.msi" -File -ErrorAction SilentlyContinue
          )
          if ($artifacts.Count -lt 2) {
            throw "Expected NSIS and MSI artifacts; found $($artifacts.Count)."
          }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $lines | Set-Content -Encoding ascii "frontend/src-tauri/target/release/bundle/SHA256SUMS.txt"
          $lines | ForEach-Object { Write-Host $_ }

      - name: Upload Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medical-redact-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medical-redact-windows-x64-failure-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/core/build/reports/**
            frontend/src-tauri/target/release/build/**/output
            frontend/src-tauri/target/release/bundle/**
